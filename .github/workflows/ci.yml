name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_runner
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: gustafta_ci_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_runner -d gustafta_ci_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      CI_TEST_DATABASE_URL: postgres://ci_runner:disposable_ci_only@127.0.0.1:5432/gustafta_ci_integration_test
      DATABASE_URL: postgres://ci_runner:disposable_ci_only@127.0.0.1:5432/gustafta_ci_integration_test
      DATABASE_URL_POOLED: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Prepare portable locked dependencies
        run: |
          node --test tests/visual-ci-lock.test.mjs
          node scripts/prepare-visual-ci-lock.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify installed test runtime
        run: node --input-type=module -e "await import('express'); await import('zod'); await import('vitest/node');"

      - name: Verify isolated database guard
        run: node --test tests/ci-test-database-guard.test.mjs

      - name: Provision empty disposable database and product-only fixtures
        run: npx tsx scripts/setup-ci-test-database.ts

      - name: Run tests
        # This job receives only its disposable service URL, never a repository
        # DATABASE_URL secret or a connection to the real application.
        run: npm test
