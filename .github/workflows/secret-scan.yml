name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  gitleaks:
    name: Detect leaked secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for gitleaks-action to post PR comments (optional but harmless)
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can diff against the base branch on PRs
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only needed for private repos on paid plan;
          # the free tier (public repos) works without it.
          # Uncomment and add the secret if this repo is private:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Set up Node.js for dependency-free scanner
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"

      - name: Verify project-specific detection and redaction
        run: node --test tests/project-secret-patterns.test.mjs

      - name: Check project-specific secret patterns
        run: node scripts/check-project-secrets.mjs
